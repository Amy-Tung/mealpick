:root{--main:#0ABAB5;--soft:#DDF8F7;--ink:#263238;--muted:#6b7c80;--line:#d8eeee;--danger:#e45b52;--bg:#f7fbfa;--card:#fff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,var(--soft),#fff 38%,var(--bg));font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input,select{font:inherit}button{border:0;border-radius:13px;padding:12px 16px;min-height:44px;background:var(--main);color:#fff;font-weight:900;cursor:pointer}.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.danger{background:var(--danger);color:#fff}.wrap{max-width:1180px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.title h1{margin:0 0 6px;font-size:30px}.title p{margin:0;color:var(--muted);line-height:1.5}.room{display:none;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.admin .room{display:flex}.room select,.field input,.field select,.search{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.iconBtn{width:44px;height:44px;padding:0;display:grid;place-items:center}.card{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:22px;box-shadow:0 14px 35px rgba(0,80,80,.08);padding:18px}.grid{display:grid;grid-template-columns:minmax(320px,1fr) 420px;gap:16px;margin-top:18px}.result{text-align:center;margin-bottom:14px}.result b{font-size:28px;color:var(--main)}.wheelBox{display:grid;place-items:center;padding:14px}.wheelWrap{position:relative;width:min(82vw,430px);aspect-ratio:1}.pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);z-index:3;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--ink)}.wheelLayer{position:absolute;inset:0;border-radius:50%;transition:transform .6s cubic-bezier(.12,.8,.12,1)}.wheel{position:absolute;inset:0;border-radius:50%;border:10px solid #fff;box-shadow:0 10px 24px #0001}.labels{position:absolute;inset:0}.label{position:absolute;left:50%;top:50%;width:42%;transform-origin:left center;font-weight:900;color:#fff;text-shadow:0 1px 2px #0008;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;padding-left:12px;text-align:center}.centerBtn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:38%;height:38%;border-radius:50%;background:#fff;color:var(--ink);border:1px solid var(--line);z-index:4}.side{display:grid;gap:14px}.section{border:1px solid var(--line);border-radius:16px;background:#fff;padding:14px}.section h3{margin:0 0 10px}.chips,.tagBox{display:flex;gap:8px;flex-wrap:wrap}.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;background:#fff;padding:8px 10px;font-weight:800}.optionList{display:grid;gap:8px;max-height:380px;overflow:auto}.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff}.item.off{opacity:.45}.itemName{font-weight:900}.tag{color:var(--muted);font-size:13px;margin-top:4px}.mini{display:flex;gap:6px}.mini button{width:38px;height:38px;min-height:38px;padding:0;border-radius:10px}.status{padding:12px;border-radius:14px;background:#fff7ed;border:1px solid #fbebde;color:#7a421b}.modal{position:fixed;inset:0;background:#0006;display:none;place-items:center;padding:18px;z-index:20}.modal.show{display:grid}.modalBox{width:min(560px,100%);background:#fff;border-radius:22px;padding:22px;box-shadow:0 20px 60px #0002}.modalBox.center{text-align:center}.modalBox.center h2{font-size:42px;margin:8px 0}.field{display:block;margin:12px 0;font-weight:800}.field input{width:100%;margin-top:6px}.row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}.row.equal>*{flex:1;min-width:130px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#173b3b;color:#fff;padding:12px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1}.missingRoom{display:none}.missing .appMain,.missing .top .room{display:none}.missing .missingRoom{display:block}#editTagChoices .edit-tag-pill,#addTagChoices .add-tag-pill{display:inline-flex;align-items:center;gap:6px;width:88px;min-width:88px;max-width:88px;height:36px;padding:8px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:14px;line-height:1;font-weight:800;white-space:nowrap;word-break:keep-all;overflow-wrap:normal;flex:0 0 88px}#editTagChoices .edit-tag-pill input,#addTagChoices .add-tag-pill input{width:14px;height:14px;margin:0;flex:0 0 14px}#editTagChoices .edit-tag-pill span,#addTagChoices .add-tag-pill span{white-space:nowrap;word-break:keep-all}.tagManageItem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px}.tagManageItem .danger{min-height:34px;padding:7px 13px;border-radius:10px}@media(max-width:860px){.wrap{padding:12px}.top{display:block}.grid{grid-template-columns:1fr}.card{padding:14px}.wheelWrap{width:min(92vw,410px)}}
.roomBadge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-weight:900;color:var(--ink)}.slotBox{display:grid;place-items:center;padding:18px}.slotMachine{width:min(92vw,460px);position:relative;text-align:center}.slotWindow{height:210px;border:3px solid var(--main);border-radius:24px;background:linear-gradient(180deg,#fff,#f4fffe);overflow:hidden;box-shadow:inset 0 20px 35px rgba(10,186,181,.12),0 14px 35px rgba(0,80,80,.08);position:relative}.slotWindow:before,.slotWindow:after{content:"";position:absolute;left:0;right:0;height:62px;z-index:2;pointer-events:none}.slotWindow:before{top:0;background:linear-gradient(#fff,rgba(255,255,255,0))}.slotWindow:after{bottom:0;background:linear-gradient(rgba(255,255,255,0),#fff)}.slotReel{position:absolute;left:0;right:0;top:0;transition:transform 1.35s cubic-bezier(.13,.82,.13,1)}.slotItem{height:70px;display:grid;place-items:center;font-size:30px;font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 20px}.slotItem.dim{color:#8aa}.slotItem.win{color:var(--main);font-size:34px}.slotBtn{margin-top:18px;border-radius:999px;font-size:20px;padding:14px 28px;min-width:180px}.slotBtn[disabled]{opacity:.65}.wheelBox{display:none!important}.resultBox{overflow:visible}.confetti{position:fixed;inset:0;pointer-events:none;overflow:visible;z-index:60}.confetti i{position:fixed;left:50%;top:58%;width:8px;height:14px;border-radius:2px;opacity:.95;animation:confettiBurst 1.45s cubic-bezier(.12,.75,.25,1) forwards}@keyframes confettiBurst{0%{transform:translate(-50%,0) rotate(0deg) scale(.8);opacity:1}55%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),var(--dy)) rotate(var(--rot)) scale(1);opacity:0}}@media(max-width:860px){.slotWindow{height:180px}.slotItem{height:60px;font-size:25px}.slotItem.win{font-size:29px}}</style></head><body><div class="wrap"><header class="top"><div class="title"><h1 id="pageTitle">今天吃什麼？交給選餐小幫手！</h1><p>不知道今天要吃什麼嗎? 交給選餐小幫手來決定! 想吃都加進來吧~ 😋</p></div><div class="room"><span class="roomBadge" id="roomBadge">🏠 xna</span><select id="roomSelect"></select><button class="secondary iconBtn" id="renameRoom" title="重新命名">✏️</button><button class="secondary iconBtn" id="roomCodeBtn" title="輸入房號">#</button><button class="secondary iconBtn" id="newRoom" title="新增房間">＋</button><button class="secondary iconBtn" id="deleteRoom" title="刪除房間">🗑️</button><button class="secondary iconBtn" id="copyLink" title="複製房間連結">🔗</button></div></header><div class="status" id="syncStatus">連線中…</div><section class="missingRoom card" style="margin-top:16px"><h2>此房號不存在</h2><p style="color:var(--muted)">請確認連結是否正確，或請管理者建立房間。</p></section><main class="grid appMain"><section><div class="card result"><div>今日結果</div><b id="resultText">還沒決定</b><div class="tag" id="historyText">最近吃過：尚無紀錄</div></div><div class="card wheelBox"><div class="wheelWrap"><div class="pointer"></div><div class="wheelLayer" id="wheelLayer"><div class="wheel" id="wheel"></div><div class="labels" id="labels"></div></div><button class="centerBtn" id="spinBtn"><b id="centerText">開始轉盤</b></button></div></div></section><aside class="card side"><section class="section"><h3>今天想吃甚麼類型的餐點？</h3><div class="chips" id="tagFilters"></div></section><section class="section"><h3>搜尋</h3><input class="search" id="searchInput" placeholder="搜尋飲食選項"></section><section class="section"><h3>飲食清單</h3><div class="optionList" id="optionList"></div></section><button id="openAddModal">＋ 新增選項</button><button class="secondary" id="openTagsModal">編輯標籤</button></aside></main></div>

const defaultTags=['主食','飲料','外送','小吃','甜點','家裡','宵夜'];const defaultFoods=[['滷味',['主食','小吃']],['麥當勞',['主食','飲料','外送']],['家裡煮',['主食','家裡']],['火鍋',['主食']],['鹽酥雞',['小吃','外送','宵夜']],['韓式料理',['主食','外送']],['雞蛋糕',['甜點']],['手搖飲',['飲料']],['宵夜店',['主食','小吃','宵夜']],['泰式料理',['主食','外送']]].map(([name,tags])=>({id:uid(),name,tags,createdAt:Date.now()}));const colors=['#0ABAB5','#67C7C3','#F4B860','#EF767A','#7D9D9C','#A1C181','#C08497','#6C9BCF'];const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);const isAdmin=params.get('admin')==='1';let roomId=(params.get('room')||'xna').replace(/[^a-zA-Z0-9_-]/g,'')||'xna';let db,docRef,online=false,roomLoaded=false,roomName='',tags=[],foods=[],search='',selectedTags=[],angle=0,editingId=null,rooms=JSON.parse(localStorage.getItem('dwRooms')||'[]');let prefs=loadPrefs();document.body.classList.toggle('admin',isAdmin);function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1700)}function esc(s){return String(s).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}function prefKey(){return 'dwPref:'+roomId}function loadPrefs(){try{return JSON.parse(localStorage.getItem(prefKey())||'{}')}catch{return {}}}function savePrefs(){localStorage.setItem(prefKey(),JSON.stringify(prefs))}function updateTitle(){let t='今天吃什麼？交給選餐小幫手！'+(roomName?'｜'+roomName:'');document.title=t;$('pageTitle').textContent='今天吃什麼？交給選餐小幫手！';let rb=$('roomBadge');if(rb)rb.textContent='🏠 '+(roomName||roomId)}function usedTags(){return tags.filter(t=>foods.some(f=>(f.tags||[]).includes(t)))}function renderTagChoices(id,chosen){let cls=id==='editTagChoices'?'edit-tag-pill':'add-tag-pill';$(id).innerHTML=tags.map(t=>`<label class="${cls}"><input type="checkbox" value="${esc(t)}" ${chosen.includes(t)?'checked':''}><span>${esc(t)}</span></label>`).join('')}function chosen(id){return [...document.querySelectorAll('#'+id+' input:checked')].map(i=>i.value)}function addTag(name,choiceId){name=name.trim();if(!name)return;if(!tags.includes(name))tags.push(name);renderTagChoices(choiceId,[...chosen(choiceId),name]);saveShared();toast('已新增標籤')}function itemWeight(id){return prefs.weights?.[id]||1}function itemOn(id){return prefs.off?.[id]!==true}function weightIcon(w){return w>=3?'😍':w>=2?'🤤':'🙂'}function weightText(w){return w>=3?'超想吃':w>=2?'想吃':'普通'}function filteredFoods(){return foods.filter(f=>(f.tags||[]).some(t=>selectedTags.includes(t))&&(!search||f.name.includes(search)||(f.tags||[]).some(t=>t.includes(search))))}function wheelFoods(){let list=filteredFoods().filter(f=>itemOn(f.id));let recent=new Set((prefs.history||[]).filter(h=>Date.now()-h.at<3*864e5).map(h=>h.name));let nr=list.filter(f=>!recent.has(f.name));return nr.length>=2?nr:list}function draw(){if(!roomLoaded)return;updateTitle();const u=usedTags();if(!selectedTags.length)selectedTags=prefs.selectedTags?.filter(t=>u.includes(t))||[...u];selectedTags=selectedTags.filter(t=>u.includes(t));if(!selectedTags.length)selectedTags=[...u];$('tagFilters').innerHTML='<label class="chip"><input type="checkbox" id="allTags" '+(u.length&&u.every(t=>selectedTags.includes(t))?'checked':'')+'>全選</label>'+u.map(t=>`<label class="chip"><input type="checkbox" value="${esc(t)}" ${selectedTags.includes(t)?'checked':''}><span>${esc(t)}</span></label>`).join('');$('allTags').onchange=e=>{selectedTags=e.target.checked?[...u]:[];prefs.selectedTags=selectedTags;savePrefs();draw()};document.querySelectorAll('#tagFilters input[value]').forEach(i=>i.onchange=()=>{selectedTags=[...document.querySelectorAll('#tagFilters input[value]:checked')].map(x=>x.value);prefs.selectedTags=selectedTags;savePrefs();draw()});const list=filteredFoods();$('optionList').innerHTML=list.map(f=>`<div class="item ${itemOn(f.id)?'':'off'}"><div><div class="itemName">${esc(f.name)}</div><div class="tag">${(f.tags||[]).map(t=>'#'+esc(t)).join('　')} · ${weightText(itemWeight(f.id))} · ${itemOn(f.id)?'使用中':'已停用'}</div></div><div class="mini"><button class="secondary" onclick="cycle('${f.id}')" title="權重">${weightIcon(itemWeight(f.id))}</button><button class="secondary" onclick="toggle('${f.id}')" title="停用/啟用">${itemOn(f.id)?'⏸️':'▶️'}</button><button class="secondary" onclick="openEdit('${f.id}')" title="編輯">✏️</button></div></div>`).join('')||'<div style="color:var(--muted);text-align:center;padding:18px">沒有符合條件的選項</div>';drawWheel(wheelFoods());$('resultText').textContent=prefs.lastResult||'還沒決定';$('historyText').textContent=(prefs.history||[]).length?'最近吃過：'+prefs.history.slice(0,6).map(h=>h.name).join('、'):'最近吃過：尚無紀錄';renderRooms()}let slotBusy=false;function drawWheel(list){const reel=$('slotReel');if(!reel)return;const base=list.length?list:foods.slice(0,5);let preview=[];for(let i=0;i<9;i++)preview.push(base[i%Math.max(1,base.length)]||{name:'請先新增選項'});reel.style.transition='none';reel.style.transform='translateY(0px)';reel.innerHTML=preview.map((f,i)=>`<div class="slotItem ${i===1?'win':'dim'}">${esc(f.name||'請先新增選項')}</div>`).join('')}function buildWeightedList(list){let pool=[];list.forEach(f=>{for(let i=0;i<itemWeight(f.id);i++)pool.push(f)});return pool.length?pool:list}function spinSlotTo(pick,list){const reel=$('slotReel');const rowH=window.innerWidth<=860?60:70;let pool=buildWeightedList(list),rows=[],minRows=90;for(let i=0;i<minRows;i++)rows.push(pool[i%pool.length]);rows.push(pick);rows.push(...pool.slice(0,8));reel.style.transition='none';reel.style.transform='translateY(0px)';reel.innerHTML=rows.map((f,i)=>`<div class="slotItem ${i===minRows?'win':'dim'}">${esc(f.name)}</div>`).join('');void reel.offsetHeight;reel.style.transition='transform 1.55s cubic-bezier(.13,.82,.13,1)';reel.style.transform=`translateY(-${(minRows-1)*rowH}px)`}function launchConfetti(){const box=$('confetti');if(!box)return;const cs=['#0ABAB5','#FFD166','#EF476F','#06D6A0','#118AB2','#FF9F1C'];box.innerHTML='';for(let i=0;i<58;i++){let el=document.createElement('i');let angle=(-150+Math.random()*120)*Math.PI/180;let power=160+Math.random()*260;let dx=Math.cos(angle)*power;let dy=Math.sin(angle)*power-(80+Math.random()*120);el.style.background=cs[i%cs.length];el.style.animationDelay=(Math.random()*0.16)+'s';el.style.setProperty('--dx',dx+'px');el.style.setProperty('--dy',dy+'px');el.style.setProperty('--rot',(360+Math.random()*720)+'deg');box.appendChild(el)}setTimeout(()=>box.innerHTML='',1700)}function renderRooms(){if(!isAdmin)return;let all=[{id:roomId,name:roomName||roomId},...rooms.filter(r=>r.id!==roomId)];$('roomSelect').innerHTML=all.map(r=>`<option value="${esc(r.id)}" ${r.id===roomId?'selected':''}>${esc(r.name||r.id)}</option>`).join('')}function rememberRoom(id,name){rooms=rooms.filter(r=>r.id!==id);rooms.unshift({id,name});rooms=rooms.slice(0,30);localStorage.setItem('dwRooms',JSON.stringify(rooms))}async function saveShared(){if(!online||!docRef||!roomLoaded)return;await docRef.set({roomName,tags,foods,updatedAt:Date.now(),deleted:false},{merge:true})}function showMissing(){document.body.classList.add('missing');$('syncStatus').textContent='此房號不存在。'}async function connect(){try{if(typeof firebase==='undefined')throw Error('Firebase SDK 未載入');if(!firebase.apps.length)firebase.initializeApp(window.DINNER_WHEEL_FIREBASE_CONFIG);db=firebase.firestore();docRef=db.collection('dinnerWheelRooms').doc(roomId);online=true;docRef.onSnapshot(snap=>{if(!snap.exists){showMissing();return}let d=snap.data()||{};if(d.deleted){showMissing();return}document.body.classList.remove('missing');roomLoaded=true;roomName=d.roomName||roomId;tags=Array.isArray(d.tags)?d.tags:(Array.isArray(d.categoriesData)?d.categoriesData:defaultTags);foods=Array.isArray(d.foods)?d.foods.map(f=>({id:f.id||uid(),name:f.name||'未命名',tags:Array.isArray(f.tags)?f.tags:[f.cat||'主食'],createdAt:f.createdAt||Date.now()})):defaultFoods;rememberRoom(roomId,roomName);$('syncStatus').textContent='已連線：選餐小幫手正式版。共用清單與標籤會同步，個人勾選、權重、停用、歷史與結果只存在自己的裝置。';draw()},e=>{$('syncStatus').textContent='同步失敗，請檢查 Firebase Rules。';console.error(e)})}catch(e){$('syncStatus').textContent='Firebase 無法連線：'+e.message;console.error(e)}}window.cycle=id=>{prefs.weights=prefs.weights||{};prefs.weights[id]=(itemWeight(id)%3)+1;savePrefs();draw()};window.toggle=id=>{prefs.off=prefs.off||{};prefs.off[id]=!prefs.off[id];savePrefs();draw()};window.openEdit=id=>{editingId=id;let f=foods.find(x=>x.id===id);$('editName').value=f.name;renderTagChoices('editTagChoices',f.tags||[]);$('editModal').classList.add('show')};$('spinBtn').onclick=()=>{let list=wheelFoods();if(list.length<2){toast('至少需要 2 個可用選項');return}if(slotBusy)return;slotBusy=true;$('spinBtn').disabled=true;$('centerText').textContent='決定中…';let pool=buildWeightedList(list),pick=pool[Math.floor(Math.random()*pool.length)]||list[0];spinSlotTo(pick,list);setTimeout(()=>{prefs.lastResult=pick.name;prefs.history=[{name:pick.name,at:Date.now()},...(prefs.history||[])].slice(0,30);savePrefs();$('modalPick').textContent=pick.name;$('mapSearch').style.display=['家裡煮','不吃','不吃晚餐'].includes(pick.name)?'none':'inline-flex';$('mapSearch').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(pick.name);$('resultModal').classList.add('show');launchConfetti();$('centerText').textContent='再來一次';$('spinBtn').disabled=false;slotBusy=false;draw()},1650)};$('openAddModal').onclick=()=>{$('foodName').value='';$('newTagName').value='';renderTagChoices('addTagChoices',[]);$('addModal').classList.add('show')};$('closeAddModal').onclick=()=>$('addModal').classList.remove('show');$('addTagInModal').onclick=()=>addTag($('newTagName').value,'addTagChoices');$('confirmAdd').onclick=async()=>{let name=$('foodName').value.trim(),ts=chosen('addTagChoices');if(!name||!ts.length){toast('請輸入名稱並至少選一個標籤');return}foods.push({id:uid(),name,tags:ts,createdAt:Date.now()});$('addModal').classList.remove('show');await saveShared();draw()};$('addTagInEdit').onclick=()=>addTag($('editNewTagName').value,'editTagChoices');$('cancelEdit').onclick=()=>$('editModal').classList.remove('show');$('saveEdit').onclick=async()=>{let name=$('editName').value.trim(),ts=chosen('editTagChoices');if(!name||!ts.length){toast('請輸入名稱並至少選一個標籤');return}foods=foods.map(f=>f.id===editingId?{...f,name,tags:ts}:f);$('editModal').classList.remove('show');await saveShared();draw()};$('deleteFromEdit').onclick=async()=>{if(confirm('確定刪除這個選項？')){foods=foods.filter(f=>f.id!==editingId);$('editModal').classList.remove('show');await saveShared();draw()}};function renderTagManager(){$('tagManageList').innerHTML=tags.map(t=>`<div class="tagManageItem"><div><b>#${esc(t)}</b><div class="tag">${foods.filter(f=>(f.tags||[]).includes(t)).length} 個選項使用中</div></div><button class="danger" onclick="deleteTag('${esc(t)}')">刪除</button></div>`).join('')||'<div style="color:var(--muted);padding:12px">尚無標籤</div>'}window.deleteTag=async(t)=>{let used=foods.filter(f=>(f.tags||[]).includes(t)).length;if(used>0){alert('這個標籤裡面還有 '+used+' 個選項在使用喔！先把這些選項改到其他標籤，或刪掉相關選項後，才能刪除這個標籤。');return}if(confirm('確定刪除標籤「'+t+'」？')){tags=tags.filter(x=>x!==t);await saveShared();renderTagManager();draw()}};$('openTagsModal').onclick=()=>{renderTagManager();$('tagsModal').classList.add('show')};$('closeTagsModal').onclick=()=>$('tagsModal').classList.remove('show');$('addManagedTag').onclick=async()=>{let n=$('manageNewTag').value.trim();if(n&&!tags.includes(n)){tags.push(n);$('manageNewTag').value='';await saveShared();renderTagManager();draw()}};$('searchInput').oninput=e=>{search=e.target.value.trim();draw()};$('closeResult').onclick=()=>$('resultModal').classList.remove('show');$('spinAgain').onclick=()=>{$('resultModal').classList.remove('show');$('spinBtn').click()};$('copyLink').onclick=async()=>{await navigator.clipboard.writeText(location.href);toast('已複製房間連結')};$('roomSelect').onchange=e=>{location.href=location.pathname+'?room='+e.target.value+'&admin=1'};$('renameRoom').onclick=async()=>{let n=prompt('房間名稱',roomName);if(n){roomName=n.trim();await saveShared();draw()}};$('roomCodeBtn').onclick=()=>{let c=prompt('輸入房號');if(c)location.href=location.pathname+'?room='+c.replace(/[^a-zA-Z0-9_-]/g,'')+'&admin=1'};$('newRoom').onclick=()=>{$('newRoomName').value='';$('newRoomCode').value=uid().slice(0,6);$('newRoomModal').classList.add('show')};$('cancelNewRoom').onclick=()=>$('newRoomModal').classList.remove('show');$('confirmNewRoom').onclick=async()=>{let code=$('newRoomCode').value.trim().replace(/[^a-zA-Z0-9_-]/g,'')||uid().slice(0,6),name=$('newRoomName').value.trim()||code;let data={roomName:name,tags:$('copyCurrentRoom').checked?tags:defaultTags,foods:$('copyCurrentRoom').checked?foods:defaultFoods,deleted:false,updatedAt:Date.now()};await db.collection('dinnerWheelRooms').doc(code).set(data);location.href=location.pathname+'?room='+code+'&admin=1'};$('deleteRoom').onclick=()=>$('deleteRoomModal').classList.add('show');$('cancelDeleteRoom').onclick=()=>$('deleteRoomModal').classList.remove('show');$('confirmDeleteRoom').onclick=async()=>{await docRef.set({deleted:true,deletedAt:Date.now()},{merge:true});location.href=location.pathname+'?room='+roomId+'&admin=1'};connect();
</script></body></html>
