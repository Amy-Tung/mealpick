v></div><div class="modal" id="tagsModal"><div class="modalBox"><button class="xBtn" id="closeTagsModal">×</button><h2>編輯標籤</h2><p style="color:var(--muted)">仍有選項使用的標籤不能刪除。</p><div id="tagManageList"></div><label class="field">新增標籤<input id="manageNewTag" placeholder="例如：宵夜、早午餐"></label><div class="row equal"><button id="addManagedTag">＋ 新增標籤</button></div></div></div><div class="modal" id="newRoomModal"><div class="modalBox"><button class="xBtn" id="cancelNewRoom">×</button><h2>新增房間</h2><label class="field">房間名稱<input id="newRoomName" placeholder="例如：勝利路"></label><label class="field">房間代碼<input id="newRoomCode" placeholder="例如：xna"></label><label class="chip"><input type="checkbox" id="copyCurrentRoom" checked> 複製目前房間清單</label><div class="row equal"><button class="secondary" id="randomRoomCode">隨機代碼</button><button id="confirmNewRoom">建立房間</button></div></div></div><div class="modal" id="resultModal"><div class="modalBox" style="text-align:center;overflow:visible"><button class="xBtn" id="closeResult">×</button><div class="confetti" id="confetti"></div><h2>今天就吃</h2><div id="modalPick" style="font-size:34px;font-weight:900;color:var(--main)"></div><div class="row equal"><a id="mapSearch" target="_blank" style="background:var(--main);color:#fff;text-decoration:none;border-radius:14px;padding:12px 16px;font-weight:900;display:inline-flex;justify-content:center">🔎 搜尋店家</a><button id="spinAgain">▶ 再來一次</button></div></div></div><div class="toast" id="toast"></div><script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script>const params=new URLSearchParams(location.search),isAdmin=params.get('admin')==='1';let roomId=(params.get('room')||'xna').toLowerCase().replace(/[^a-zA-Z0-9_-]/g,'')||'xna';document.body.classList.toggle('admin',isAdmin);const $=id=>document.getElementById(id),defaultTags=['主食','飲 ?.filter(t=>u.includes(t))||[...u];if(!selectedTags.length)selectedTags=[...u];$('tagFilters').innerHTML='<label class="chip"><input type="checkbox" id="allTags" '+(u.length&&u.every(t=>selectedTags.includes(t))?'checked':'')+'>全選</label>'+u.map(t=>`<label class="chip"><input type="checkbox" value="${esc(t)}" ${selectedTags.includes(t)?'checked':''}><span>${esc(t)}(${foods.filter(f=>(f.tags||[]).includes(t)).length})</span></label>`).join('');$('allTags').onchange=e=>{selectedTags=e.target.checked?[...u]:[];prefs.selectedTags=selectedTags;savePrefs();draw()};document.querySelectorAll('#tagFilters input[value]').forEach(i=>i.onchange=()=>{selectedTags=[...document.querySelectorAll('#tagFilters input[value]:checked')].map(x=>x.value);prefs.selectedTags=selectedTags;savePrefs();draw()});$('optionList').innerHTML=filteredFoods().map(f=>`<div class="item ${itemOn(f.id)?'':'off'}"><div><div class="itemName">${esc(f.name)}</div><div class="tag">${(f.tags||[]).map(t=>'#'+esc(t)).join('　')} · ${weightText(itemWeight(f.id))} · ${itemOn(f.id)?'使用中':'已停用'}</div></div><div class="mini"><button class="secondary" onclick="cycle('${f.id}')">${weightIcon(itemWeight(f.id))}</button><button class="secondary" onclick="toggle('${f.id}')">${itemOn(f.id)?'⏸️':'▶️'}</button><button class="secondary" onclick="openEdit('${f.id}')">✏️</button></div></div>`).join('')||'<div style="color:var(--muted);padding:18px;text-align:center">沒有符合條件的選項</div>';drawWheel(wheelFoods());$('resultText').textContent=prefs.lastResult||'還沒決定';$('resultHistory').textContent=(prefs.history||[]).length?'最近吃過：'+prefs.history.slice(0,3).map(h=>h.name).join('、'):'最近吃過：尚無紀錄'}function pool(list){let p=[];list.forEach(f=>{for(let i=0;i<itemWeight(f.id);i++)p.push(f)});return p.length?p:list}function drawWheel(list){let r=$('slotReel'),base=list.length?list:foods.slice(0,5),rows=[];for(let i=0;i<9;i++)rows.push(base[i%Math.max(1,base.length)]||{name:'請先新增選項'});r.style.transition='none';r.style.transform='translateY(0)';r.i
