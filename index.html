ent(#fff,rgba(255,255,255,0))}.slotWindow:after{bottom:0;background:linear-gradient(rgba(255,255,255,0),#fff)}.slotReel{position:absolute;left:0;right:0;top:0;transition:transform 1.35s cubic-bezier(.13,.82,.13,1)}.slotItem{height:70px;display:grid;place-items:center;font-size:30px;font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 20px}.slotItem.dim{color:#8aa}.slotItem.win{color:var(--main);font-size:34px}.slotBtn{margin-top:18px;border-radius:999px;font-size:20px;padding:14px 28px;min-width:180px}.sectionTitle{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 10px}.sectionTitle h2{margin:0;font-size:18px}.filters,.tagBox{display:flex;gap:8px;flex-wrap:wrap}.searchAddRow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-bottom:14px}.search{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;font-size:16px}.foodPanel #optionList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:12px;background:#fff}.item.off{opacity:.55}.itemName{font-weight:900}.tag{display:inline-flex;gap:5px;flex-wrap:wrap;margin-top:5px;color:var(--muted);font-size:13px}.mini{display:flex;gap:6px}.mini button{width:38px;height:38px;border-radius:10px;padding:0;display:grid;place-items:center;font-size:17px}button{border:0;border-radius:14px;background:var(--main);color:white;font-weight:900;padding:12px 16px;min-height:44px;cursor:pointer}button.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}button.danger{background:var(--danger);color:#fff}.modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.modalBox{background:#fff;border-radius:24px;max-width:520px;width:100%;padding:20px;max-height:88vh;overflow:auto;position:relative}.xBtn{position:absolute;right:14px;top:12px;width:36px;height:36px;border-radius:50%;padding:0;min-height:36px;background:#fff;color:var(--ink);border:1px solid var(--line);font-size:20px}.field{display:block;margin:12px 0;font-weight:800}.field input{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px}.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:16px}.row.equal>*{flex:1;min-width:135px}.editFooter{display:flex;gap:10px;justify-content:space-between;margin-top:16px}.editFooter button{flex:1}.edit-tag-pill,.add-tag-pill{display:inline-flex;align-items:center;gap:6px;width:88px;height:36px;padding:8px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:14px;font-weight:800;white-space:nowrap}.add-new-tag-chip{border:1px dashed var(--main);color:var(--main);background:#f3fffe;font-weight:900}.quickTagInput{display:none;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.quickTagInput.show{display:grid}.quickTagInput input{border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#173b3b;color:#fff;padding:12px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1}.resultBox{overflow:visible}.confetti{position:fixed;inset:0;pointer-events:none;z-index:60}.confetti i{position:fixed;left:50%;top:58%;width:8px;height:14px;border-radius:2px;opacity:.95;animation:confettiBurst 1.45s cubic-bezier(.12,.75,.25,1) forwards}@keyframes confettiBurst{0%{transform:translate(-50%,0) rotate(0) scale(.8);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),var(--dy)) rotate(var(--rot)) scale(1);opacity:0}}@media(max-width:860px){.wrap{padding:12px}.top{display:block}.title h1{font-size:25px}.room{justify-content:flex-start;margin-top:10px}.topGrid{grid-template-columns:1fr}.foodPanel #optionList{grid-template-columns:1fr}.item{grid-template-columns:1fr}.mini{justify-content:flex-end}.slotWindow{height:180px}.slotItem{height:60px;font-size:25px}.slotItem.win{font-size:29px}.searchAddRow{grid-template-columns:1fr}.resultActions>*{flex-basis:100%}}</style></head><body><div class="wrap"><header class="top"><div class="title"><h1>今天吃什麼？交給選餐小幫手！</h1><p>不知道今天要吃什麼嗎? 交給拉霸機來決定! 想吃都加進來吧~ 😋</p></div><div class="room"><span class="roomBadge" id="roomBadge">🏠 XnA</span></div></header><div class="status" id="syncStatus">選餐小幫手正式上線版：共用清單與標籤會同步，個人勾選、權重、停用、歷史與結果只存在自己的裝置。</div><section class="missingRoom card" style="margin-top:16px"><h2>此房號不存在</h2><p style="color:var(--muted)">請確認房間連結是否正確，或請管理者建立房間。</p><button id="copyMissingRoom">複製目前房號</button></section><main class="appMain"><div class="topGrid"><section><div class="card result"><div>今日結果</div><b id="resultText">還沒決定</b><div id="resultHistory" style="color:var(--muted);margin-top:6px">最近吃過：尚無紀錄</div></div><div class="card slotBox"><div class="slotMachine"><div class="slotWindow"><div class="slotReel" id="slotReel"></div></div><button class="slotBtn" id="spinBtn"><span id="centerText">開始決定</span></button></div></div></section><aside class="card"><div class="sectionTitle"><h2>今天想吃甚麼類型的餐點？</h2><button id="openTagsModal" class="secondary" type="button">編輯標籤</button></div><div class="filters" id="tagFilters"></div></aside></div><section class="card foodPanel"><div class="sectionTitle"><h2>飲食清單</h2></div><div class="searchAddRow"><input class="search" id="searchInput" placeholder="搜尋飲食清單"><button id="openAddModal" class="addOptionBtn">＋ 新增選項</button></div><div id="optionList"></div></section></main></div><div class="modal" id="addModal"><div class="modalBox"><h2 style="margin-top:0">新增選項</h2><label class="field">名稱<input id="foodName" placeholder="例如：滷味"></label><div class="field">選擇標籤，可複選<div class="tagBox" id="addTagChoices"></div><div class="quickTagInput" id="quickTagInput"><input id="newTagName" placeholder="輸入新標籤"><button type="button" id="addTagInModal">加入</button></div></div><div class="row equal"><button class="secondary" id="closeAddModal">取消</button><button id="confirmAdd">加入轉盤</button></div></div></div><div class="modal" id="editModal"><div class="modalBox"><button class="xBtn" id="cancelEdit" type="button">×</button><h2 style="margin-top:0">編輯選項</h2><label class="field">更改名稱<input id="editName"></label><div class="field">更改標籤<div class="tagBox" id="editTagChoices"></div></div><label class="field">新增標籤<input id="editNewTagName" placeholder="新增後可直接勾選"><button type="button" id="addTagInEdit" style="margin-top:8px">＋ 新增標籤</button></label><div class="editFooter"><button class="danger" id="deleteFromEdit">刪除</button><button id="saveEdit">儲存</button></div></div></div><div class="modal" id="tagsModal"><div class="modalBox"><button class="xBtn" id="closeTagsModal" type="button">×</button><h2 style="margin-top:0">編輯標籤</h2><p style="color:var(--muted)">可新增或刪除標籤。仍有選項正在使用的標籤，會先提醒你，不能直接刪除。</p><div id="tagManageList"></div><label class="field">新增標籤<input id="manageNewTag" placeholder="例如：宵夜、早午餐"></label><div class="row equal"><button id="addManagedTag" type="button">＋ 新增標籤</button></div></div></div><div class="modal" id="resultModal"><div class="modalBox resultBox" style="text-align:center"><button class="xBtn" id="closeResult" type="button">×</button><div class="confetti" id="confetti"></div><h2>今天就吃</h2><div id="modalPick" style="font-size:34px;font-weight:900;color:var(--main)">火鍋</div><div class="row equal resultActions"><a id="mapSearch" href="#" target="_blank" style="background:var(--main);color:#fff;text-decoration:none;border-radius:14px;padding:12px 16px;font-weight:900;display:inline-flex;align-items:center;justify-content:center">🔎 搜尋店家</a><button id="spinAgain" type="button">▶ 再來一次</button></div></div></div><div class="toast" id="toast"></div><script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script>const params=new URLSearchParams(location.search);const isAdmin=params.get('admin')==='1';let roomId=(params.get('room')||'xna').toLowerCase().replace(/[^a-zA-Z0-9_-]/g,'')||'xna';document.body.classList.toggle('admin',isAdmin);const $=id=>document.getElementById(id);const defaultTags=['主食','飲料','外送','小吃','甜點','家裡','宵夜'];function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}const defaultFoods=[['滷味',['主食','小吃']],['麥當勞',['主食','飲料','外送']],['家裡煮',['主食','家裡']],['火鍋',['主食']],['鹽酥雞',['小吃','外送','宵夜']],['韓式料理',['主食','外送']],['雞蛋糕',['甜點']],['手搖飲',['飲料']],['宵夜店',['主食','小吃','宵夜']],['泰式料理',['主食','外送']]].map(([name,tags])=>({id:uid(),name,tags,createdAt:Date.now()}));let search='',selectedTags=[],editingId=null,tags=[],foods=[],roomName='',db,docRef,online=false,roomLoaded=false,slotBusy=false;function esc(s){return String(s).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1500)}function prefKey(){return 'mealpickPref:'+roomId}function loadPrefs(){try{return JSON.parse(localStorage.getItem(prefKey())||'{}')}catch{return {}}}let prefs=loadPrefs();function savePrefs(){localStorage.setItem(prefKey(),JSON.stringify(prefs))}function itemWeight(id){return prefs.weights?.[id]||1}function itemOn(id){return prefs.off?.[id]!==true}function weightIcon(w){return w>=3?'😍':w>=2?'🤤':'🙂'}function weightText(w){return w>=3?'超想吃':w>=2?'想吃':'普通'}function usedTags(){return tags.filter(t=>foods.some(f=>(f.tags||[]).includes(t)))}function filteredFoods(){return foods.filter(f=>(f.tags||[]).some(t=>selectedTags.includes(t))&&(!search||f.name.includes(search)||(f.tags||[]).some(t=>t.includes(search))))}function wheelFoods(){return filteredFoods().filter(f=>itemOn(f.id))}async function saveShared(){if(!online||!docRef||!roomLoaded)return;await docRef.set({roomName,tags,foods,updatedAt:Date.now(),deleted:false},{merge:true})}function updateTitle(){let title='今天吃什麼？交給選餐小幫手！'+(roomName?'｜'+roomName:'');document.title=title;document.querySelector('.title h1').textContent='今天吃什麼？交給選餐小幫手！';$('roomBadge').textContent='🏠 '+(roomName||roomId)}function draw(){if(!roomLoaded)return;updateTitle();const u=usedTags();selectedTags=selectedTags.filter(t=>u.includes(t));if(!selectedTags.length)selectedTags=prefs.selectedTags?.filter(t=>u.includes(t))||[...u];if(!selectedTags.length)selectedTags=[...u];$('tagFilters').innerHTML='<label class="chip"><input type="checkbox" id="allTags" '+(u.length&&u.every(t=>selectedTags.includes(t))?'checked':'')+'>全選</label>'+u.map(t=>{let c=foods.filter(f=>(f.tags||[]).includes(t)).length;return `<label class="chip"><input type="checkbox" value="${esc(t)}" ${selectedTags.includes(t)?'checked':''}><span>${esc(t)}(${c})</span></label>`}).join('');$('allTags').onchange=e=>{selectedTags=e.target.checked?[...u]:[];prefs.selectedTags=selectedTags;savePrefs();draw()};document.querySelectorAll('#tagFilters input[value]').forEach(i=>i.onchange=()=>{selectedTags=[...document.querySelectorAll('#tagFilters input[value]:checked')].map(x=>x.value);prefs.selectedTags=selectedTags;savePrefs();draw()});const list=filteredFoods();$('optionList').innerHTML=list.map(f=>`<div class="item ${itemOn(f.id)?'':'off'}"><div><div class="itemName">${esc(f.name)}</div><div class="tag">${(f.tags||[]).map(t=>'#'+esc(t)).join('　')} · ${weightText(itemWeight(f.id))} · ${itemOn(f.id)?'使用中':'已停用'}</div></div><div class="mini"><button class="secondary" onclick="cycle('${f.id}')" title="權重">${weightIcon(itemWeight(f.id))}</button><button class="secondary" onclick="toggle('${f.id}')" title="停用/啟用">${itemOn(f.id)?'⏸️':'▶️'}</button><button class="secondary" onclick="openEdit('${f.id}')" title="編輯">✏️</button></div></div>`).join('')||'<div style="color:var(--muted);text-align:center;padding:18px">沒有符合條件的選項</div>';drawWheel(wheelFoods());$('resultText').textContent=prefs.lastResult||'還沒決定';$('resultHistory').textContent=(prefs.history||[]).length?'最近吃過：'+prefs.history.slice(0,3).map(h=>h.name).join('、'):'最近吃過：尚無紀錄'}function buildWeightedList(list){let pool=[];list.forEach(f=>{for(let i=0;i<itemWeight(f.id);i++)pool.push(f)});return pool.length?pool:list}function drawWheel(list){const reel=$('slotReel');const base=list.length?list:foods.slice(0,5);let preview=[];for(let i=0;i<9;i++)preview.push(base[i%Math.max(1,base.length)]||{name:'請先新增選項'});reel.style.transition='none';reel.style.transform='translateY(0px)';reel.innerHTML=preview.map((f,i)=>`<div class="slotItem ${i===1?'win':'dim'}">${esc(f.name||'請先新增選項')}</div>`).join('')}function spinSlotTo(pick,list){const reel=$('slotReel');const rowH=window.innerWidth<=860?60:70;let pool=buildWeightedList(list),rows=[],minRows=90;for(let i=0;i<minRows;i++)rows.push(pool[i%pool.length]);rows.push(pick);rows.push(...pool.slice(0,8));reel.style.transition='none';reel.style.transform='translateY(0px)';reel.innerHTML=rows.map((f,i)=>`<div class="slotItem ${i===minRows?'win':'dim'}">${esc(f.name)}</div>`).join('');void reel.offsetHeight;reel.style.transition='transform 1.55s cubic-bezier(.13,.82,.13,1)';reel.style.transform=`translateY(-${(minRows-1)*rowH}px)`}function renderTagChoices(id,chosen){let cls=id==='editTagChoices'?'edit-tag-pill':(id==='addTagChoices'?'add-tag-pill':'chip');$(id).innerHTML=tags.map(t=>`<label class="${cls}"><input type="checkbox" value="${esc(t)}" ${chosen.includes(t)?'checked':''}><span>${esc(t)}</span></label>`).join('')+(id==='addTagChoices'?'<button type="button" class="add-new-tag-chip" id="showQuickTag">＋新增</button>':'');if(id==='addTagChoices'&&$('showQuickTag')){$('showQuickTag').onclick=()=>{$('quickTagInput').classList.toggle('show');$('newTagName').focus()}}}function chosen(id){return [...document.querySelectorAll('#'+id+' input:checked')].map(i=>i.value)}async function addTag(name,choiceId){name=name.trim();if(!nam
