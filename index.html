const colors=['#0ABAB5','#6bd7d3','#8de2df','#5ec8c4','#37c2bd','#8bd0cf','#4db6b1'];let angle=0,search='',selectedTags=[],last='還沒決定',editingId=null;let history=[];let tags=['主食','飲料','外送','小吃','甜點','家裡','宵夜'];let foods=[{id:'1',name:'滷味',tags:['主食','小吃'],on:true,w:3},{id:'2',name:'麥當勞',tags:['主食','飲料','外送'],on:true,w:2},{id:'3',name:'家裡煮',tags:['主食','家裡'],on:true,w:2},{id:'4',name:'火鍋',tags:['主食'],on:true,w:1},{id:'5',name:'鹽酥雞',tags:['小吃','外送','宵夜'],on:true,w:1},{id:'6',name:'韓式料理',tags:['主食','外送'],on:true,w:1},{id:'7',name:'雞蛋糕',tags:['甜點'],on:true,w:1},{id:'8',name:'手搖飲',tags:['飲料'],on:true,w:1},{id:'9',name:'宵夜店',tags:['主食','小吃','宵夜'],on:true,w:1},{id:'10',name:'泰式料理',tags:['主食','外送'],on:true,w:1}];selectedTags=[...usedTags()];const $=id=>document.getElementById(id);function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1500)}function usedTags(){return tags.filter(t=>foods.some(f=>f.tags.includes(t)))}function weightIcon(w){return w>=3?'😍':w>=2?'🤤':'🙂'}function weightText(w){return w>=3?'超想吃':w>=2?'想吃':'普通'}function filteredFoods(){return foods.filter(f=>f.tags.some(t=>selectedTags.includes(t))&&(!search||f.name.includes(search)||f.tags.some(t=>t.includes(search))))}function wheelFoods(){return filteredFoods().filter(f=>f.on)}function draw(){const u=usedTags();selectedTags=selectedTags.filter(t=>u.includes(t));if(!selectedTags.length)selectedTags=[...u];$('tagFilters').innerHTML='<label class="chip"><input type="checkbox" id="allTags" '+(u.every(t=>selectedTags.includes(t))?'checked':'')+'>全選</label>'+u.map(t=>{let c=foods.filter(f=>f.tags.includes(t)).length;return `<label class="chip"><input type="checkbox" value="${t}" ${selectedTags.includes(t)?'checked':''}><span>${t}(${c})</span></label>`}).join('');$('allTags').onchange=e=>{selectedTags=e.target.checked?[...u]:[];draw()};document.querySelectorAll('#tagFilters input[value]').forEach(i=>i.onchange=()=>{selectedTags=[...document.querySelectorAll('#tagFilters input[value]:checked')].map(x=>x.value);draw()});renderTagChoices('addTagChoices',[]);const list=filteredFoods();$('optionList').innerHTML=list.map(f=>`<div class="item ${f.on?'':'off'}"><div><div class="itemName">${f.name}</div><div class="tag">${f.tags.map(t=>'#'+t).join('　')} · ${weightText(f.w)} · ${f.on?'使用中':'已停用'}</div></div><div class="mini"><button class="secondary" onclick="cycle('${f.id}')" title="權重">${weightIcon(f.w)}</button><button class="secondary" onclick="toggle('${f.id}')" title="停用/啟用">${f.on?'⏸️':'▶️'}</button><button class="secondary" onclick="openEdit('${f.id}')" title="編輯">✏️</button></div></div>`).join('')||'<div style="color:var(--muted);text-align:center;padding:18px">沒有符合條件的選項</div>';drawWheel(wheelFoods())}let slotBusy=false;
function buildWeightedList(list){let pool=[];list.forEach(f=>{for(let i=0;i<(f.w||1);i++)pool.push(f)});return pool.length?pool:list}
function drawWheel(list){const reel=$('slotReel');if(!reel)return;const base=list.length?list:foods.slice(0,5);let preview=[];for(let i=0;i<9;i++){preview.push(base[i%Math.max(1,base.length)]||{name:'請先新增選項'})}reel.style.transition='none';reel.style.transform='translateY(0px)';reel.innerHTML=preview.map((f,i)=>`<div class="slotItem ${i===1?'win':'dim'}">${f.name||'請先新增選項'}</div>`).join('')}
function spinSlotTo(pick,list){const reel=$('slotReel');const rowH=window.innerWidth<=860?60:70;let pool=buildWeightedList(list);let rows=[];const minRows=90;for(let i=0;i<minRows;i++){rows.push(pool[i%pool.length])}rows.push(pick);rows.push(...pool.slice(0,8));reel.style.transition='none';reel.style.transform='translateY(0px)';reel.innerHTML=rows.map((f,i)=>`<div class="slotItem ${i===minRows?'win':'dim'}">${f.name}</div>`).join('');void reel.offsetHeight;reel.style.transition='transform 1.55s cubic-bezier(.13,.82,.13,1)';reel.style.transform=`translateY(-${(minRows-1)*rowH}px)`}
function renderTagChoices(id,chosen){let cls=id==='editTagChoices'?'edit-tag-pill':(id==='addTagChoices'?'add-tag-pill':'chip');$(id).innerHTML=tags.map(t=>`<label class="${cls}"><input type="checkbox" value="${t}" ${chosen.includes(t)?'checked':''}><span>${t}</span></label>`).join('')+(id==='addTagChoices'?'<button type="button" class="add-new-tag-chip" id="showQuickTag">＋新增</button>':'');if(id==='addTagChoices'&&$('showQuickTag')){$('showQuickTag').onclick=()=>{$('quickTagInput').classList.toggle('show');$('newTagName').focus()}}}function chosen(id){return [...document.querySelectorAll('#'+id+' input:checked')].map(i=>i.value)}function addTag(name,choiceId){name=name.trim();if(!name)return;if(!tags.includes(name))tags.push(name);renderTagChoices(choiceId,[...chosen(choiceId),name]);toast('已新增標籤')}window.cycle=id=>{foods=foods.map(f=>f.id===id?{...f,w:f.w%3+1}:f);draw()};window.toggle=id=>{foods=foods.map(f=>f.id===id?{...f,on:!f.on}:f);draw()};window.openEdit=id=>{editingId=id;let f=foods.find(x=>x.id===id);$('editName').value=f.name;renderTagChoices('editTagChoices',f.tags);$('editModal').classList.add('show')};$('openAddModal').onclick=()=>{$('foodName').value='';$('newTagName').value='';$('quickTagInput').classList.remove('show');renderTagChoices('addTagChoices',[]);$('addModal').classList.add('show')};$('closeAddModal').onclick=()=>$('addModal').classList.remove('show');$('addTagInModal').onclick=()=>{let v=$('newTagName').value.trim();if(!v)return;addTag(v,'addTagChoices');$('newTagName').value='';$('quickTagInput').classList.remove('show')};$('newTagName').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('addTagInModal').click()}});$('confirmAdd').onclick=()=>{let name=$('foodName').value.trim(),ts=chosen('addTagChoices');if(!name||!ts.length){toast('請輸入名稱並至少選一個標籤');return}foods.push({id:Date.now()+'',name,tags:ts,on:true,w:1});$('addModal').classList.remove('show');draw()};$('addTagInEdit').onclick=()=>addTag($('editNewTagName').value,'editTagChoices');$('cancelEdit').onclick=()=>$('editModal').classList.remove('show');$('saveEdit').onclick=()=>{let ts=chosen('editTagChoices'),name=$('editName').value.trim();if(!name||!ts.length){toast('請輸入名稱並至少選一個標籤');return}foods=foods.map(f=>f.id===editingId?{...f,name,tags:ts}:f);$('editModal').classList.remove('show');draw()};$('deleteFromEdit').onclick=()=>{if(confirm('確定刪除這個選項？')){foods=foods.filter(f=>f.id!==editingId);$('editModal').classList.remove('show');draw()}};$('searchInput').oninput=e=>{search=e.target.value.trim();draw()};$('spinBtn').onclick=()=>{let list=wheelFoods();if(list.length<2){toast('至少需要 2 個可用選項');return}if(slotBusy)return;slotBusy=true;$('spinBtn').disabled=true;$('centerText').textContent='決定中…';let total=list.reduce((s,f)=>s+(f.w||1),0),r=Math.random()*total,acc=0,pick=list[0];for(let i=0;i<list.length;i++){acc+=list[i].w||1;if(r<=acc){pick=list[i];break}}spinSlotTo(pick,list);setTimeout(()=>{last=pick.name;history.unshift({name:last,at:Date.now()});history=history.slice(0,20);$('resultText').textContent=last;$('centerText').textContent='再來一次';$('spinBtn').disabled=false;slotBusy=false;showResult(last)},1650)};function launchConfetti(){const box=$('confetti');if(!box)return;const cs=['#0ABAB5','#FFD166','#EF476F','#06D6A0','#118AB2','#FF9F1C'];box.innerHTML='';for(let i=0;i<58;i++){let el=document.createElement('i');let angle=(-150+Math.random()*120)*Math.PI/180;let power=160+Math.random()*260;let dx=Math.cos(angle)*power;let dy=Math.sin(angle)*power-(80+Math.random()*120);el.style.background=cs[i%cs.length];el.style.animationDelay=(Math.random()*0.16)+'s';el.style.setProperty('--dx',dx+'px');el.style.setProperty('--dy',dy+'px');el.style.setProperty('--rot',(360+Math.random()*720)+'deg');box.appendChild(el)}setTimeout(()=>box.innerHTML='',1700)}function showResult(name){$('modalPick').textContent=name;let hideMap=['家裡煮','不吃','不吃晚餐'].includes(name);$('mapSearch').style.display=hideMap?'none':'inline-flex';$('mapSearch').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(name);$('resultModal').classList.add('show');launchConfetti();$('resultHistory').textContent='最近吃過：'+(history.length?history.slice(0,3).map(h=>h.name).join('、'):'尚無紀錄')}$('closeResult').onclick=()=>$('resultModal').classList.remove('show');$('spinAgain').onclick=()=>{$('resultModal').classList.remove('show');$('spinBtn').click()};
function renderTagManager(){
  $('tagManageList').innerHTML=tags.map(t=>`<div class="item tagManageItem"><div><div class="itemName">#${t}</div><div class="tag">${foods.filter(f=>f.tags.includes(t)).length} 個選項使用中</div></div><div class="mini"><button class="danger" onclick="deleteTag('${t}')">刪除</button></div></div>`).join('')||'<div style="color:var(--muted);padding:12px">尚無標籤</div>';
}
window.deleteTag=(t)=>{ const used=foods.filter(f=>f.tags.includes(t)).length; if(used>0){ alert('這個標籤裡面還有 '+used+' 個選項在使用喔！先把這些選項改到其他標籤，或刪掉相關選項後，才能刪除這個標籤。'); return; } if(confirm('確定刪除標籤「'+t+'」？')){ tags=tags.filter(x=>x!==t); renderTagManager(); draw(); toast('已刪除標籤'); } };
$('openTagsModal').onclick=()=>{ renderTagManager(); $('tagsModal').classList.add('show'); };
$('closeTagsModal').onclick=()=>$('tagsModal').classList.remove('show');
$('addManagedTag').onclick=()=>{ let name=$('manageNewTag').value.trim(); if(!name)return; if(!tags.includes(name))tags.push(name); $('manageNewTag').value=''; renderTagManager(); draw(); toast('已新增標籤'); };
$('copyMissingRoom').onclick=()=>toast('已複製目前房號');draw();
